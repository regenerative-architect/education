# Link watch
# -------------------------------------------------------------------------
# Every Monday, checks every external link in the app, the library and the
# READMEs with lychee (lycheeverse/lychee-action, Apache-2.0 or MIT). If any
# are broken, it opens an issue listing them (or adds to the open one), so
# teachers never meet a dead link. Run it any time from the Actions tab.
#
# Good to know: a link checker can't tell when a website has changed hands
# and now shows something else. Skim the linked sites now and then too.
# Some sites refuse automated checks (status 403 or 429); those count as fine.
# -------------------------------------------------------------------------
name: Link watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every external link
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200..=299,403,429
            --exclude "^https?://(localhost|127\.0\.0\.1)"
            --exclude "example\.(org|com)"
            site/index.html
            "site/library/docs/*.html"
            "*.md"
            "docs/*.md"
          output: ./lychee/out.md
          fail: false
      - name: Open or update an issue when links break
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links found by the weekly link watch"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file ./lychee/out.md
          else
            gh issue create --title "$title" --body-file ./lychee/out.md
          fi
